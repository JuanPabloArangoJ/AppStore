<h2 mat-dialog-title>Set your new password</h2>

<mat-dialog-content>
  <p>This is your first login. Choose a password to continue.</p>

  <div class="formPassword">
    <mat-form-field appearance="outline">
      <mat-label>New password</mat-label>
      <input matInput type="password" [formField]="passwordForm.newPassword">
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Confirm password</mat-label>
      <input matInput type="password" [formField]="passwordForm.confirmPassword">
    </mat-form-field>

    @if (error()) {
      <p class="error">{{ error() }}</p>
    }
  </div>
</mat-dialog-content>

<mat-dialog-actions>
  <button matButton="elevated" (click)="close()">
    <mat-icon>close</mat-icon>
    Cancel
  </button>
  <button matButton="elevated" [disabled]="!canSave()" (click)="save()">
    <mat-icon>save</mat-icon>
    Save
  </button>
</mat-dialog-actions>
