<button type="button" class="switch" role="switch" aria-label="Dark mode" [attr.aria-checked]="theme.isDark()"
    [class.night]="theme.isDark()" [class.on]="theme.isDark()" (click)="theme.toggle()">

    <div class="track">

        <div class="stars">
            @for (s of stars; track $index) {
            <span [style.left.%]="s.x" [style.top.%]="s.y"></span>
            }
        </div>

        <div class="toggle-shooting-stars">
            <span class="toggle-shooting s1"></span>
            <span class="toggle-shooting s2"></span>
            <span class="toggle-shooting s3"></span>
        </div>

        <div class="moon">🌙</div>
        <div class="sun"></div>

        <div class="birds">
            @for (b of birds; track b) {
            <svg [class]="'bird b' + b" viewBox="0 0 14 8" aria-hidden="true">
                <path class="wing" d="M0 6 Q7 -2 14 6 Q7 3 0 6Z" fill="#eef6ff" />
            </svg>
            }
        </div>

        <div class="clouds">
            <div class="cloud-track">
                @for (c of clouds; track c.id) {
                <img [src]="theme.isDark() ? c.dark : c.light" alt="" aria-hidden="true" draggable="false">
                }
            </div>
        </div>


    </div>

    <div class="knob"></div>
</button>
